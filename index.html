<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mausolée royal de Maurétanie — AR GPS</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 23px;
    }

    p {
      color: #ccc;
    }

    button {
      border: 0;
      border-radius: 25px;
      padding: 14px 22px;
      margin: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #info {
      padding: 15px;
      background: #222;
      line-height: 1.7;
    }

    #camera {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 10;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /*
      Le Mausolée est caché par défaut.
    */

    #monument {
      display: none;

      position: absolute;

      left: 50%;
      top: 50%;

      width: 70vw;
      height: 70vh;

      transform:
        translate(-50%, -50%);

      pointer-events: auto;

      background: transparent;
    }

    #direction {

      position: absolute;

      top: 20px;
      left: 15px;
      right: 15px;

      z-index: 30;

      padding: 12px;

      background:
        rgba(0,0,0,0.70);

      border-radius: 12px;

      font-size: 16px;
    }

    #close {

      position: absolute;

      top: 70px;
      right: 15px;

      z-index: 40;

      background: white;
      color: black;
    }

    #warning {

      display: none;

      padding: 15px;

      background: #332200;

      color: #ffd27a;

      margin: 10px;

      border-radius: 10px;
    }

  </style>
</head>


<body>


<header>

  <h1>
    🏛️ Mausolée royal de Maurétanie
  </h1>

  <p>
    Expérience AR géolocalisée
  </p>

  <button onclick="startGPS()">
    📍 Activer ma position
  </button>

  <button onclick="startCamera()">
    📷 Démarrer
  </button>

</header>


<div id="info">

  <div id="gpsStatus">
    📍 GPS : non activé
  </div>

  <div id="distance">
    📏 Distance : —
  </div>

  <div id="bearing">
    🎯 Direction : —
  </div>

  <div id="heading">
    🧭 Orientation : —
  </div>

</div>


<div id="warning">
  Approchez-vous du point du monument pour
  débloquer la reconstitution 3D.
</div>


<!--
  Modèle 3D classique.
  Il reste disponible pour consultation.
-->

<model-viewer

  src="mausolee.glb"

  alt="Reconstitution 3D du Mausolée royal de Maurétanie"

  camera-controls

  shadow-intensity="1"

  exposure="1"

  style="
    width:100%;
    height:60vh;
    background:#222;
  ">

</model-viewer>


<!--
  MODE CAMÉRA
-->

<div id="camera">


  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <div id="direction">
    📍 Activation du GPS...
  </div>


  <model-viewer

    id="monument"

    src="mausolee.glb"

    alt="Mausolée royal de Maurétanie"

    camera-controls

    shadow-intensity="1"

    exposure="1">

  </model-viewer>


  <button
    id="close"
    onclick="closeCamera()">

    ✕ Fermer

  </button>


</div>


<script>


/* =====================================================
   POSITION GPS DU MONUMENT — TEST
   ===================================================== */

const TARGET_LAT =
  36.6724831;

const TARGET_LON =
  3.1432060;


/*
   RAYON DE DÉCLENCHEMENT

   Le Mausolée n'apparaît qu'à 10 mètres
   ou moins du point GPS.
*/

const ACTIVATION_RADIUS =
  10;


/* =====================================================
   VARIABLES
   ===================================================== */

let userLat = null;

let userLon = null;

let targetBearing = null;

let phoneHeading = null;

let currentDistance = Infinity;


/* =====================================================
   GPS
   ===================================================== */

function startGPS() {

  if (!navigator.geolocation) {

    document.getElementById(
      "gpsStatus"
    ).innerText =
      "❌ GPS non disponible.";

    return;
  }


  document.getElementById(
    "gpsStatus"
  ).innerText =
    "📍 Recherche de votre position...";


  navigator.geolocation.watchPosition(

    function(position) {


      userLat =
        position.coords.latitude;


      userLon =
        position.coords.longitude;


      /*
        Calcul de la distance
      */

      currentDistance =
        calculateDistance(

          userLat,
          userLon,

          TARGET_LAT,
          TARGET_LON

        );


      /*
        Calcul de la direction
      */

      targetBearing =
        calculateBearing(

          userLat,
          userLon,

          TARGET_LAT,
          TARGET_LON

        );


      /*
        Affichage GPS
      */

      document.getElementById(
        "gpsStatus"
      ).innerText =
        "✅ GPS actif";


      document.getElementById(
        "distance"
      ).innerText =
        "📏 Distance : " +
        Math.round(currentDistance) +
        " m";


      document.getElementById(
        "bearing"
      ).innerText =
        "🎯 Direction : " +
        Math.round(targetBearing) +
        "°";


      /*
        Vérification du rayon
      */

      updateActivation();


    },

    function(error) {


      document.getElementById(
        "gpsStatus"
      ).innerText =
        "❌ GPS refusé";


      document.getElementById(
        "warning"
      ).style.display =
        "block";

    },


    {

      enableHighAccuracy: true,

      maximumAge: 1000,

      timeout: 15000

    }

  );

}


/* =====================================================
   ACTIVATION DU MONUMENT
   ===================================================== */

function updateActivation() {


  const monument =
    document.getElementById(
      "monument"
    );


  /*
    PLUS DE 10 MÈTRES
    =================

    Monument invisible.
  */

  if (
    currentDistance >
    ACTIVATION_RADIUS
  ) {


    monument.style.display =
      "none";


    document.getElementById(
      "warning"
    ).style.display =
      "block";


    document.getElementById(
      "direction"
    ).innerText =

      "📍 Approchez-vous du monument : " +

      Math.round(currentDistance) +

      " m";


    return;

  }


  /*
    10 MÈTRES OU MOINS
    ===================

    Monument activé.
  */

  monument.style.display =
    "block";


  document.getElementById(
    "warning"
  ).style.display =
    "none";


  document.getElementById(
    "direction"
  ).innerText =

    "🏛️ Monument activé — " +

    Math.round(currentDistance) +

    " m";


  updateMonumentPosition();

}


/* =====================================================
   CALCUL DISTANCE
   ===================================================== */

function calculateDistance(

  lat1,
  lon1,

  lat2,
  lon2

) {


  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (lat2 - lat1) *
    Math.PI /
    180;


  const dl =
    (lon2 - lon1) *
    Math.PI /
    180;


  const a =

    Math.sin(dp / 2) *
    Math.sin(dp / 2)

    +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl / 2) *
    Math.sin(dl / 2);


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );


  return R * c;

}


/* =====================================================
   CALCUL DE LA DIRECTION
   ===================================================== */

function calculateBearing(

  lat1,
  lon1,

  lat2,
  lon2

) {


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dl =
    (lon2 - lon1) *
    Math.PI /
    180;


  const y =
    Math.sin(dl) *
    Math.cos(p2);


  const x =

    Math.cos(p1) *
    Math.sin(p2)

    -

    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);


  let bearing =

    Math.atan2(y, x) *
    180 /
    Math.PI;


  return (
    bearing + 360
  ) % 360;

}


/* =====================================================
   ORIENTATION
   ===================================================== */

function startOrientation() {


  /*
    Certains appareils demandent
    une autorisation spéciale.
  */

  if (

    typeof DeviceOrientationEvent !==
    "undefined"

    &&

    typeof DeviceOrientationEvent.requestPermission ===
    "function"

  ) {


    DeviceOrientationEvent
      .requestPermission()

      .then(function(permission) {


        if (
          permission ===
          "granted"
        ) {


          window.addEventListener(

            "deviceorientationabsolute",

            handleOrientation,

            true

          );

        }

      })

      .catch(
        console.error
      );

  }


  else {


    window.addEventListener(

      "deviceorientationabsolute",

      handleOrientation,

      true

    );


    window.addEventListener(

      "deviceorientation",

      handleOrientation,

      true

    );

  }

}


/* =====================================================
   LECTURE BOUSSOLE
   ===================================================== */

function handleOrientation(
  event
) {


  let heading =
    null;


  /*
    iPhone
  */

  if (

    event.webkitCompassHeading
    !== undefined

  ) {


    heading =
      event.webkitCompassHeading;

  }


  /*
    Android
  */

  else if (

    event.alpha !==
    null

  ) {


    heading =
      360 -
      event.alpha;

  }


  if (
    heading !== null
  ) {


    phoneHeading =

      (
        heading + 360
      ) % 360;


    document.getElementById(
      "heading"
    ).innerText =

      "🧭 Orientation : " +

      Math.round(
        phoneHeading
      ) +

      "°";


    updateMonumentPosition();

  }

}


/* =====================================================
   POSITION DU MODÈLE SUR L'ÉCRAN
   ===================================================== */

function updateMonumentPosition() {


  /*
    Ne rien faire si le visiteur
    n'est pas dans le rayon.
  */

  if (

    currentDistance >
    ACTIVATION_RADIUS

  ) {


    return;

  }


  if (

    targetBearing ===
    null

    ||

    phoneHeading ===
    null

  ) {


    return;

  }


  /*
    Différence entre :

    direction du monument

    et

    direction du téléphone.
  */

  let difference =

    targetBearing -
    phoneHeading;


  /*
    Normalisation
    -180° → +180°
  */

  while (
    difference > 180
  ) {

    difference -= 360;

  }


  while (
    difference < -180
  ) {

    difference += 360;

  }


  /*
    Champ de vision approximatif.
  */

  const FOV =
    70;


  /*
    Position horizontale.

    50 = centre.
  */

  let position =

    50 +

    (
      difference /
      FOV
    ) *

    50;


  /*
    Limitation écran.
  */

  position =

    Math.max(
      -100,
      Math.min(
        200,
        position
      )
    );


  const monument =
    document.getElementById(
      "monument"
    );


  monument.style.left =
    position + "%";


  /*
    Message direction.
  */

  if (
    Math.abs(difference) <
    10
  ) {


    document.getElementById(
      "direction"
    ).innerText =

      "🏛️ MONUMENT DEVANT VOUS";

  }

  else if (
    difference > 0
  ) {


    document.getElementById(
      "direction"
    ).innerText =

      "➡️ Tournez à droite";

  }

  else {


    document.getElementById(
      "direction"
    ).innerText =

      "⬅️ Tournez à gauche";

  }

}


/* =====================================================
   CAMÉRA
   ===================================================== */

async function startCamera() {


  try {


    const stream =

      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              "environment"

          }

        });


    document.getElementById(
      "video"
    ).srcObject =
      stream;


    document.getElementById(
      "camera"
    ).style.display =
      "block";


    /*
      Commence l'orientation
    */

    startOrientation();


    /*
      Si le GPS n'est pas encore
      activé, on le lance.
    */

    if (
      userLat === null
    ) {

      startGPS();

    }


    updateActivation();


  }

  catch (error) {


    alert(

      "Impossible d'ouvrir la caméra. " +

      "Autorisez la caméra dans Chrome."

    );

  }

}


/* =====================================================
   FERMER
   ===================================================== */

function closeCamera() {


  const video =
    document.getElementById(
      "video"
    );


  if (
    video.srcObject
  ) {


    video.srcObject
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );

  }


  document.getElementById(
    "camera"
  ).style.display =
    "none";

}

</script>

</body>
</html>
