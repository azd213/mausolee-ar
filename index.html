<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mausolée royal de Maurétanie — 3D & Réalité augmentée</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 20px 15px 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    p {
      color: #ccc;
      margin: 8px 0;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background: #222;
    }

    #ar-button {
      display: none;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #111;
      border: none;
      border-radius: 30px;
      padding: 15px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    #message {
      text-align: center;
      padding: 15px;
      color: #ccc;
      font-size: 14px;
    }

    #fallback {
      display: none;
      text-align: center;
      padding: 15px;
      background: #222;
    }

    #fallback button {
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Mausolée royal de Maurétanie</h1>
  <p>Reconstitution historique en 3D</p>
</header>

<model-viewer
  id="model"
  src="mausolee.glb"
  alt="Reconstitution 3D du Mausolée royal de Maurétanie"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-scale="fixed">

  <button id="ar-button" slot="ar-button">
    📱 Voir en réalité augmentée
  </button>

</model-viewer>

<div id="message">
  Faites tourner le modèle avec votre doigt ou votre souris.
</div>

<div id="fallback">
  <p>
    La réalité augmentée native n'est pas disponible sur cet appareil.
  </p>

  <button onclick="showCameraMode()">
    📷 Essayer le mode caméra
  </button>
</div>

<script>

  const model = document.getElementById("model");
  const arButton = document.getElementById("ar-button");
  const fallback = document.getElementById("fallback");

  /*
   * Vérification de la disponibilité de l'AR
   */

  model.addEventListener("load", async () => {

    try {

      const available = await model.canActivateAR;

      if (available) {
        arButton.style.display = "block";
      } else {
        fallback.style.display = "block";
      }

    } catch (error) {

      fallback.style.display = "block";

    }

  });

  /*
   * Mode caméra de secours
   *
   * Important :
   * ce mode ne fournit pas le même tracking
   * qu'une vraie ARCore/ARKit.
   */

  async function showCameraMode() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      alert(
        "La caméra n'est pas disponible sur ce navigateur."
      );

      return;
    }

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          }
        });

      document.body.innerHTML = `
        <div style="
          position:fixed;
          inset:0;
          background:black;
          overflow:hidden;
        ">

          <video
            id="camera"
            autoplay
            playsinline
            style="
              width:100%;
              height:100%;
              object-fit:cover;
            ">
          </video>

          <div style="
            position:absolute;
            top:15px;
            left:15px;
            right:15px;
            padding:12px;
            background:rgba(0,0,0,.65);
            color:white;
            border-radius:10px;
            text-align:center;
          ">
            Mode caméra de secours
          </div>

          <button
            onclick="location.reload()"
            style="
              position:absolute;
              bottom:25px;
              left:50%;
              transform:translateX(-50%);
              padding:14px 22px;
              border:none;
              border-radius:25px;
              font-size:16px;
            ">
            Retour
          </button>

        </div>
      `;

      document.getElementById("camera").srcObject = stream;

    } catch (error) {

      alert(
        "Impossible d'accéder à la caméra. Vérifiez les permissions."
      );

    }

  }

</script>

</body>
</html>
