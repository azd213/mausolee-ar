<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mausolée — Test GPS</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 18px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      background: #222;
    }

    button {
      margin: 12px;
      padding: 15px 22px;
      border: 0;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
    }

    #gps {
      padding: 15px;
      background: #222;
    }

    #camera {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 20;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #modelOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 60%;
      background: transparent;
    }

    #closeCamera {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 30;
    }
  </style>
</head>

<body>

<header>
  <h1>🏛️ Mausolée royal de Maurétanie</h1>
  <p>Test de positionnement GPS</p>
</header>

<div id="gps">
  <p id="status">Recherche de votre position...</p>
  <p id="distance"></p>
  <p id="direction"></p>
</div>

<button onclick="startGPS()">
  📍 Activer ma position
</button>

<button onclick="openCamera()">
  📷 Mode caméra
</button>

<model-viewer
  src="mausolee.glb"
  alt="Mausolée royal de Maurétanie"
  camera-controls
  shadow-intensity="1"
  exposure="1">
</model-viewer>

<div id="camera">

  <video id="video" autoplay playsinline></video>

  <model-viewer
    id="modelOverlay"
    src="mausolee.glb"
    camera-controls
    shadow-intensity="1">
  </model-viewer>

  <button id="closeCamera" onclick="closeCamera()">
    ✕ Fermer
  </button>

</div>

<script>

const TARGET_LAT = 36.6724831;
const TARGET_LON = 3.1432060;

let userLat = null;
let userLon = null;

function startGPS() {

  if (!navigator.geolocation) {

    document.getElementById("status").innerText =
      "❌ GPS non disponible.";

    return;
  }

  document.getElementById("status").innerText =
    "📍 Recherche GPS...";

  navigator.geolocation.watchPosition(

    function(position) {

      userLat = position.coords.latitude;
      userLon = position.coords.longitude;

      const distance = calculateDistance(
        userLat,
        userLon,
        TARGET_LAT,
        TARGET_LON
      );

      const bearing = calculateBearing(
        userLat,
        userLon,
        TARGET_LAT,
        TARGET_LON
      );

      document.getElementById("status").innerText =
        "✅ Position GPS détectée";

      document.getElementById("distance").innerText =
        "📏 Distance : " + Math.round(distance) + " m";

      document.getElementById("direction").innerText =
        "🧭 Direction du monument : " +
        Math.round(bearing) + "°";

    },

    function(error) {

      document.getElementById("status").innerText =
        "❌ Impossible d'obtenir votre position GPS.";

    },

    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 15000
    }
  );
}


/* Distance entre deux positions GPS */

function calculateDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;

  const dp =
    (lat2 - lat1) * Math.PI / 180;

  const dl =
    (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dp / 2) *
    Math.sin(dp / 2) +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) *
    Math.sin(dl / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


/* Direction vers le point cible */

function calculateBearing(lat1, lon1, lat2, lon2) {

  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;

  const dl =
    (lon2 - lon1) * Math.PI / 180;

  const y =
    Math.sin(dl) * Math.cos(p2);

  const x =
    Math.cos(p1) * Math.sin(p2) -
    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  let bearing =
    Math.atan2(y, x) * 180 / Math.PI;

  return (bearing + 360) % 360;
}


/* Caméra */

async function openCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        }
      });

    document.getElementById("video").srcObject =
      stream;

    document.getElementById("camera").style.display =
      "block";

  } catch (error) {

    alert(
      "Impossible d'ouvrir la caméra. Autorisez l'accès à la caméra."
    );

  }
}


function closeCamera() {

  const video =
    document.getElementById("video");

  if (video.srcObject) {

    video.srcObject
      .getTracks()
      .forEach(track => track.stop());
  }

  document.getElementById("camera").style.display =
    "none";
}

</script>

</body>
</html>
