<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mausolée royal de Maurétanie — Réalité augmentée</title>

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    p {
      color: #ccc;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #222;
    }

    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      
      background: #ffffff;
      color: #111;
      border: none;
      border-radius: 30px;
      padding: 16px 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mausolée royal de Maurétanie</h1>
    <p>Reconstitution historique en 3D</p>
  </header>

  <model-viewer
    src="mausolee.glb"
    alt="Modèle 3D du Mausolée royal de Maurétanie"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    ar-scale="fixed">

    <button class="ar-button" slot="ar-button">
      📱 Voir en réalité augmentée
    </button>

  </model-viewer>

</body>
</html>
